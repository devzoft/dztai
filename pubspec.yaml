name: dztwai
description: "DevZoft AI multi-model assistant powered by OpenRouter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_markdown: ^0.7.7
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  gpt_markdown: ^1.4.1
  audioplayers: ^6.8.1
  video_player: ^2.14.1
  flutter_svg: ^2.5.0
  web: ^1.1.2
  file_saver: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#071637"
  adaptive_icon_background: "#071637"
  adaptive_icon_foreground: assets/brand/app_icon.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#071637"
    theme_color: "#071637"
  windows:
    generate: true
    image_path: assets/brand/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/brand/app_icon.png
